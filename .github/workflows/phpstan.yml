name: phpstan

on:
  push:
    branches: [main]
    paths: ['**.php', 'phpstan.neon.dist']
  pull_request:
    branches: [main]
    paths: ['**.php', 'phpstan.neon.dist']

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout task-runs-laravel (path repository)
        run: git clone --depth=1 https://github.com/phattarachai/task-runs-laravel.git ../task-runs-laravel

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
